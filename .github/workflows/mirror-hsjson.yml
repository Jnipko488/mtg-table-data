name: Mirror HearthstoneJSON art
on:
  push:
    branches: [battlegrounds-multiplayer-20261125]
    paths: ['hsbg/hsjson/paths.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: battlegrounds-multiplayer-20261125
          fetch-depth: 1
      - name: Download art
        run: |
          cd hsbg/hsjson
          : > missing.txt
          grep -v '^$' paths.txt | xargs -P 16 -I{} sh -c 'if [ ! -s "{}" ]; then mkdir -p "$(dirname "{}")"; curl -sfL --retry 3 -o "{}" "https://art.hearthstonejson.com/{}" || { rm -f "{}"; echo "{}" >> missing.txt; }; fi'
          sort -o missing.txt missing.txt
          echo "downloaded: $(find v1 -type f | wc -l)  missing: $(wc -l < missing.txt)"
      - name: Commit
        run: |
          git config user.name "hsbg-mirror"
          git config user.email "hsbg-mirror@users.noreply.github.com"
          git add hsbg/hsjson
          git commit -m "Mirror HearthstoneJSON art for Battlegrounds (multiplayer-safe)" || exit 0
          git push origin HEAD:battlegrounds-multiplayer-20261125
